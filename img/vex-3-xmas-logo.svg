<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 65" width="240" height="58" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="vexGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="xmasGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="45%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="badgeXmasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="neonGlowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#EF4444" flood-opacity="0.8" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="heavyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Left Emblem: Christmas Vex Parkour Stickman with Santa Hat -->
  <g transform="translate(6, 4)">
    <!-- Hexagonal Shield Background with Snow/Ice trim -->
    <polygon points="26,1 49,14 49,42 26,55 3,42 3,14" 
             fill="url(#shieldGrad)" 
             stroke="#10B981" 
             stroke-width="2" 
             filter="url(#heavyShadow)"/>

    <!-- Snowflake / Star behind -->
    <line x1="26" y1="12" x2="26" y2="44" stroke="#38BDF8" stroke-width="1.2" opacity="0.4"/>
    <line x1="10" y1="28" x2="42" y2="28" stroke="#38BDF8" stroke-width="1.2" opacity="0.4"/>
    <line x1="14" y1="16" x2="38" y2="40" stroke="#38BDF8" stroke-width="1.2" opacity="0.4"/>
    <line x1="14" y1="40" x2="38" y2="16" stroke="#38BDF8" stroke-width="1.2" opacity="0.4"/>

    <!-- Running Stickman (Vex Character) -->
    <!-- Head -->
    <circle cx="26" cy="19" r="4" fill="#FFFFFF"/>
    <!-- Santa Hat on Stickman -->
    <path d="M23 18 L29 18 L33 11 Z" fill="#EF4444"/>
    <circle cx="33.5" cy="11" r="1.8" fill="#FFFFFF"/>
    <rect x="22" y="17" width="8" height="2" rx="1" fill="#FFFFFF"/>
    <!-- Torso -->
    <line x1="26" y1="23" x2="26" y2="34" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <!-- Arms running -->
    <line x1="26" y1="26" x2="20" y2="30" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="26" x2="33" y2="23" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <!-- Legs running / jumping -->
    <line x1="26" y1="34" x2="20" y2="43" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="34" x2="33" y2="39" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="33" y1="39" x2="31" y2="45" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Glowing Sparkle / Checkpoint Flag Indicator -->
    <circle cx="39" cy="18" r="2.5" fill="#EF4444" filter="url(#neonGlowRed)"/>
    <circle cx="39" cy="18" r="1.2" fill="#FFFFFF"/>
  </g>

  <!-- Ice / Snow trail line passing across -->
  <line x1="56" y1="31" x2="272" y2="31" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="8 4"/>
  <circle cx="272" cy="31" r="2" fill="#10B981"/>

  <!-- Typography: VEX 3 -->
  <g transform="translate(60, 0)">
    <!-- Text Shadow -->
    <text x="0" y="27" 
          font-family="'Impact', 'Arial Black', 'Montserrat', 'Trebuchet MS', sans-serif" 
          font-size="25" 
          font-weight="900" 
          letter-spacing="2" 
          fill="#000000" 
          opacity="0.8">VEX 3</text>
    <!-- Foreground Text -->
    <text x="0" y="26" 
          font-family="'Impact', 'Arial Black', 'Montserrat', 'Trebuchet MS', sans-serif" 
          font-size="25" 
          font-weight="900" 
          letter-spacing="2" 
          fill="url(#vexGrad)">VEX 3</text>

    <!-- Christmas Candy Accent -->
    <circle cx="82" cy="14" r="3" fill="#EF4444"/>
    <circle cx="82" cy="14" r="1.5" fill="#FFFFFF"/>

    <!-- Typography: XMAS -->
    <!-- XMAS Glow Layer -->
    <text x="0" y="52" 
          font-family="'Impact', 'Arial Black', 'Montserrat', sans-serif" 
          font-size="23" 
          font-weight="900" 
          letter-spacing="4" 
          fill="#EF4444" 
          opacity="0.5" 
          filter="url(#neonGlowRed)">XMAS</text>
    <!-- XMAS Base Layer -->
    <text x="0" y="52" 
          font-family="'Impact', 'Arial Black', 'Montserrat', sans-serif" 
          font-size="23" 
          font-weight="900" 
          letter-spacing="4" 
          fill="url(#xmasGrad)">XMAS</text>

    <!-- Badge: UNBLOCKED -->
    <g transform="translate(100, 37)">
      <rect x="0" y="0" width="102" height="17" rx="4" 
            fill="url(#badgeXmasGrad)" 
            stroke="#34D399" 
            stroke-width="1"
            filter="url(#heavyShadow)"/>
      <text x="51" y="12" 
            font-family="'Arial Black', 'Montserrat', sans-serif" 
            font-size="9.5" 
            font-weight="900" 
            letter-spacing="1.5" 
            text-anchor="middle" 
            fill="#FFFFFF">UNBLOCKED</text>
    </g>
  </g>
</svg>

