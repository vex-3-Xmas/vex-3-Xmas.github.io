<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 65" width="240" height="58" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="rooftopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="sniperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="45%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="scopeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="50%" stop-color="#FF8500"/>
      <stop offset="100%" stop-color="#FFD600"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="neonGlowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feFlood flood-color="#FF3B30" flood-opacity="0.8" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonGlowOrange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#FF6B00" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="heavyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Left Emblem: Sniper Tactical Crosshair & Building Rooftop -->
  <g transform="translate(6, 4)">
    <!-- Hexagonal Shield Background -->
    <polygon points="26,1 49,14 49,42 26,55 3,42 3,14" 
             fill="url(#shieldGrad)" 
             stroke="#FF5722" 
             stroke-width="2" 
             filter="url(#heavyShadow)"/>

    <!-- Subtle Rooftop Silhouette inside Emblem -->
    <rect x="10" y="32" width="12" height="15" fill="#334155" opacity="0.6"/>
    <rect x="22" y="24" width="18" height="23" fill="#475569" opacity="0.8"/>
    <rect x="36" y="30" width="8" height="17" fill="#334155" opacity="0.6"/>
    
    <!-- Mini Sniper on Rooftop Silhouettes -->
    <!-- Player 1 (Blue) -->
    <circle cx="16" cy="28" r="2.5" fill="#38BDF8"/>
    <rect x="15" y="30" width="3" height="4" fill="#38BDF8"/>
    <line x1="17" y1="31" x2="22" y2="30" stroke="#E2E8F0" stroke-width="1.2"/>

    <!-- Player 2 (Red) -->
    <circle cx="34" cy="21" r="2.5" fill="#EF4444"/>
    <rect x="33" y="23" width="3" height="4" fill="#EF4444"/>
    <line x1="33" y1="24" x2="28" y2="24" stroke="#E2E8F0" stroke-width="1.2"/>

    <!-- Sniper Crosshair Ring Overlay -->
    <circle cx="26" cy="27" r="19" 
            stroke="url(#scopeGrad)" 
            stroke-width="1.8" 
            fill="none" 
            opacity="0.9"
            stroke-dasharray="22 5 22 5"/>

    <circle cx="26" cy="27" r="9" 
            stroke="#FF3B30" 
            stroke-width="1.2" 
            fill="none" 
            opacity="0.75"/>

    <!-- Crosshair Target Ticks -->
    <line x1="26" y1="4" x2="26" y2="12" stroke="#FF5722" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="26" y1="42" x2="26" y2="50" stroke="#FF5722" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="4" y1="27" x2="11" y2="27" stroke="#FF5722" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="41" y1="27" x2="48" y2="27" stroke="#FF5722" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Glowing Center Target Dot & Pulse -->
    <circle cx="26" cy="27" r="2.5" fill="#FF1744" filter="url(#neonGlowRed)"/>
    <circle cx="26" cy="27" r="1.2" fill="#FFFFFF"/>
  </g>

  <!-- Laser Beam Passing Across Banner -->
  <line x1="56" y1="31" x2="272" y2="31" stroke="#FF1744" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="10 4"/>
  <circle cx="272" cy="31" r="1.5" fill="#FF1744" filter="url(#neonGlowRed)"/>

  <!-- Typography: ROOFTOP -->
  <g transform="translate(60, 0)">
    <!-- Text Shadow for 3D depth -->
    <text x="0" y="27" 
          font-family="'Impact', 'Arial Black', 'Montserrat', 'Trebuchet MS', sans-serif" 
          font-size="25" 
          font-weight="900" 
          letter-spacing="2" 
          fill="#000000" 
          opacity="0.9"
          dy="2">ROOFTOP</text>

    <!-- Main ROOFTOP Text -->
    <text x="0" y="27" 
          font-family="'Impact', 'Arial Black', 'Montserrat', 'Trebuchet MS', sans-serif" 
          font-size="25" 
          font-weight="900" 
          letter-spacing="2" 
          fill="url(#rooftopGrad)" 
          stroke="#090D16" 
          stroke-width="1.2"
          filter="url(#heavyShadow)">ROOFTOP</text>

    <!-- Typography: SNIPERS -->
    <!-- Text Shadow for 3D depth -->
    <text x="1" y="55" 
          font-family="'Impact', 'Arial Black', 'Montserrat', 'Trebuchet MS', sans-serif" 
          font-size="27" 
          font-weight="900" 
          letter-spacing="3.5" 
          fill="#000000" 
          opacity="0.95"
          dy="2">SNIPERS</text>

    <!-- Main SNIPERS Text with Neon Fire Gradient -->
    <text x="1" y="55" 
          font-family="'Impact', 'Arial Black', 'Montserrat', 'Trebuchet MS', sans-serif" 
          font-size="27" 
          font-weight="900" 
          letter-spacing="3.5" 
          fill="url(#sniperGrad)" 
          stroke="#3B0700" 
          stroke-width="1"
          filter="url(#neonGlowOrange)">SNIPERS</text>

    <!-- Mini Scope in the 'O' of ROOFTOP or dot above 'I' of SNIPERS -->
    <circle cx="58" cy="40" r="2.8" stroke="#FFD600" stroke-width="1.2" fill="none" opacity="0.9"/>
    <circle cx="58" cy="40" r="1.2" fill="#FF1744"/>

    <!-- Tactical Accent Badge: UNBLOCKED -->
    <g transform="translate(132, 10)">
      <rect x="0" y="0" width="76" height="16" rx="4" 
            fill="#0F172A" 
            stroke="url(#badgeGrad)" 
            stroke-width="1.2"/>
      <circle cx="8" cy="8" r="2.5" fill="#00E676"/>
      <text x="16" y="11.5" 
            font-family="'Arial Black', 'Trebuchet MS', sans-serif" 
            font-size="9" 
            font-weight="900" 
            letter-spacing="1.2" 
            fill="#00F2FE">UNBLOCKED</text>
    </g>

    <!-- Small Sparkle Flare -->
    <polygon points="120,40 122,35 124,40 129,42 124,44 122,49 120,44 115,42" 
             fill="#FFF566" 
             opacity="0.85" 
             filter="url(#neonGlowOrange)"/>
  </g>
</svg>
